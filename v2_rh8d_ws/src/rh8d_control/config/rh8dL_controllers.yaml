controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    palm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    finger_effort_controller:
      type: effort_controllers/JointGroupEffortController


palm_trajectory_controller:
  ros__parameters:
    allow_partial_joints_goal: false

    joints:
      # Wrist / palm chain and Thumb axis are position controlled
      - forearm:1--base:1
      - palm_axis:1--forearm:1
      - palmL:1--palm_axis:1
      - Thumb_axis--palmL:1

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity      

finger_effort_controller:
  ros__parameters:
    allow_partial_joints_goal: false

    joints:
      # Fingers are effort controlled
      - Thumb_Methacarpal--Thumb_axis
      - Index_Proximal--palmL:1
      - Middle_Proximal--palmL:1
      - Ring_Proximal--palmL:1

    command_interfaces:
      - effort  
    state_interfaces:
      - position
      - velocity
      - effort  
